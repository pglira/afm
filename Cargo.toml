[package]
name = "afm"
version = "0.1.0"
edition = "2021"
description = "Copy and move files with rsync and watch the jobs in a terminal dashboard"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
